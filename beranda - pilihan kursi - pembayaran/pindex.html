<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBUS - Tiket Bus</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="pindex-page">

    <header class="header">

        <div class="logo">
            <img src="logoLbus.jpg" alt="LBus">
        </div>

        <div class="account">
            Budi Santoso
        </div>

    </header>

    <section class="search-section">

        <div class="search-box">

            <input type="text"
                   id="searchInput"
                   placeholder="Cari Nama Bus...">

            <button>Cari</button>

        </div>

    </section>

    <section class="main-container">

        <main class="bus-list">

            <!-- Bus 1 -->
            <div class="bus-card" data-bus-name="Sinar Jaya">

                <div class="bus-photo">
                    <img src="bus1sinarjaya.jpg" alt="Bus Sinar Jaya">
                </div>

                <div class="bus-info">

                    <img src="logo-sinarjaya.png"
                         class="po-logo"
                         alt="Logo">

                    <h3>Sinar Jaya</h3>

                    <p>Jakarta → Semarang</p>

                    <p>08:00 - 16:00</p>


                </div>

                <div class="bus-price">

                    <h2>Rp 250.000</h2>

                    <button class="detail-btn">
                        Lihat Detail
                    </button>

                </div>

            </div>

            <!-- Bus 2 -->
            <div class="bus-card" data-bus-name="Rosalia Indah">

                <div class="bus-photo">
                    <img src="bus2rosaliaindah.jpg" alt="Bus Rosalia Indah">
                </div>

                <div class="bus-info">

                    <img src="logo-rosalia.png"
                         class="po-logo"
                         alt="Logo">

                    <h3>Rosalia Indah</h3>

                    <p>Solo → Jakarta</p>

                    <p>09:00 - 18:00</p>


                </div>

                <div class="bus-price">

                    <h2>Rp 250.000</h2>

                    <button class="detail-btn">
                        Lihat Detail
                    </button>

                </div>

            </div>

            <!-- Bus 3 -->
            <div class="bus-card" data-bus-name="Haryanto">

                <div class="bus-photo">
                    <img src="bus3haryanto.jpg" alt="Bus Haryanto">
                </div>

                <div class="bus-info">

                    <img src="logo-Haryanto.png"
                         class="po-logo"
                         alt="Logo">

                    <h3>Haryanto</h3>

                    <p>Kudus → Jakarta</p>

                    <p>19:00 - 05:00</p>


                </div>

                <div class="bus-price">

                    <h2>Rp 250.000</h2>

                    <button class="detail-btn">
                        Lihat Detail
                    </button>

                </div>

            </div>
            <!--Bus 4-->
<div class="bus-card" data-bus-name="Unicorn Indorent">

                <div class="bus-photo">
                    <img src="bus4unicorn.jpg" alt="Bus Unicorn Indorent">
                </div>

                <div class="bus-info">

                    <img src="logo-unicorn.png"
                         class="po-logo"
                         alt="Logo">

                    <h3>Unicorn Indorent</h3>

                    <p>Salatiga → Tangerang</p>

                    <p>11:00 - 18:00</p>


                </div>

                <div class="bus-price">

                    <h2>Rp 250.000</h2>

                    <button class="detail-btn">
                        Lihat Detail
                    </button>

                </div>

            </div>

        </main>

    </section>


    <footer>

        <img src="logoLbus.jpg" alt="LBus">

        <p>
            LBUS - Sistem Pemesanan Tiket Bus Online
        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
